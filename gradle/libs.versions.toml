detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
ktlint-gradle = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
coil = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }
accompanist-insets = { module = "com.google.accompanist:accompanist-insets", version.ref = "accompanist" }

[bundles]
compose = ["material3", "material-icons", "activity-compose", "lifecycle-compose", "navigation-compose", "hilt-compose"]
room = ["room-runtime", "room-ktx"]
hilt = ["hilt-android"]
ktor-server = ["ktor-server-core", "ktor-server-netty", "ktor-serialization-kotlinx", "ktor-content-negotiation", "ktor-server-auth", "ktor-server-auth-jwt"]
coroutines = ["coroutines-core", "coroutines-android", "coroutines-test"]
kotlinx = ["kotlinx-serialization-json", "kotlinx-datetime"]
datastore = ["datastore-preferences", "datastore-core"]
work = ["work-runtime-ktx"]
wear = ["wear-compose-material", "wear-compose-foundation", "wear-tiles", "wear-complications", "play-services-wearable"]
auto = ["car-app", "car-app-projected"]
glance = ["glance-appwidget"]
testing = ["junit-jupiter", "junit-jupiter-params", "mockk", "robolectric", "truth", "espresso-core", "espresso-intents", "compose-ui-test", "compose-ui-test-manifest"]
analysis = ["detekt", "detekt-formatting", "ktlint-gradle"]

[plugins]
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hiltGradlePlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
